name: Typecheck

# Catches exactly the class of error we hit manually last time (stale/
# missing expo-router route types, missing static-asset module types) on
# every push/PR — instead of finding out only when someone builds locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # expo-env.d.ts and .expo/types/router.d.ts (typed routes) are
      # gitignored and normally only generated when `expo start` runs.
      # This is Expo's documented CI-safe way to generate both without
      # booting the dev server: https://docs.expo.dev/router/reference/typed-routes/
      - name: Generate Expo type declarations
        run: npx expo customize tsconfig.json

      - name: Type check
        run: npm run typecheck
